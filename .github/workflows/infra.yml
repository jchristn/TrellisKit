name: Infra

# Engine job: builds and tests the TrellisKit CDK app and synthesizes both environments for the neutral sample
# property (samples/example, the default propertyDir) and for the shared topology fixture
# (infra/fixtures/shared: the sample plus a second fixture property behind one shared API). Nothing is deployed
# and no AWS credentials are used: account ids are placeholders, availability zones come from configuration, and synth runs with lookups disabled.
# Property synths run in each property's own repository.

on:
  push:
    paths:
      - "infra/**"
      - "samples/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - "samples/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

env:
  CDK_CLI_VERSION: 2.1147.0
  CDK_DISABLE_CLI_TELEMETRY: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  infra:
    name: Build, test, and synth (dev and prod, sample property and shared fixture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore
        run: dotnet restore src/TrellisKit.Infra.sln

      - name: Build (warnings are errors)
        run: dotnet build src/TrellisKit.Infra.sln --no-restore

      - name: Test
        run: dotnet test src/TrellisKit.Infra.sln --no-build

      - name: Synth dev
        run: npx --yes "aws-cdk@${CDK_CLI_VERSION}" synth -c env=dev --no-lookups --quiet --output cdk.out/dev

      - name: Synth prod
        run: npx --yes "aws-cdk@${CDK_CLI_VERSION}" synth -c env=prod --no-lookups --quiet --output cdk.out/prod

      - name: Synth shared topology fixture (dev)
        run: npx --yes "aws-cdk@${CDK_CLI_VERSION}" synth -c env=dev -c deployment=infra/fixtures/shared/deployment.json --no-lookups --quiet --output cdk.out/shared-dev

      - name: Synth shared topology fixture (prod)
        run: npx --yes "aws-cdk@${CDK_CLI_VERSION}" synth -c env=prod -c deployment=infra/fixtures/shared/deployment.json --no-lookups --quiet --output cdk.out/shared-prod

      - name: Upload cloud assemblies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: infra/cdk.out
          if-no-files-found: ignore
