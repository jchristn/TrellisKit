# Serves the website SPA on port 8080 and proxies the API to the backend service.
# The backend is resolved at request time (Docker DNS) so nginx starts, and keeps serving
# the site, while the server container is down or restarting.
#
# This file is an nginx image template (/etc/nginx/templates/default.conf.template): at container start the
# image's entrypoint (or the combined server image's entrypoint) substitutes ${TK_WWW_BACKEND} (the backend origin)
# and ${TK_EMBED_FRAME_ANCESTORS} (the frame-ancestors sources of the assistant embed
# page, default 'self'; see docker/README.md) and writes /etc/nginx/conf.d/default.conf. nginx's own $variables
# are left alone because only defined environment variables are substituted.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind a TLS-terminating load balancer the original scheme arrives in X-Forwarded-Proto; keep it, so the
# backend sees https (secure cookies, absolute URLs). Without one (local stack), it is this connection's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # The backend: the server container (the website image) or 127.0.0.1 in the combined server image.
    set $backend ${TK_WWW_BACKEND};

    client_max_body_size 50m;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Container health check (does not depend on the backend).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Live update uploads (docs/LIVE_UPDATES_CONTRACT.md section 9): one multipart request can be hundreds of
    # megabytes, so the body limit matches the largest updates.maxUploadMegabytes worth allowing locally and the
    # body is streamed to the backend instead of being buffered to disk first.
    location /api/v1/admin/updates {
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Realtime WebSocket (docs/PHASE5_CONTRACT.md section 4.14): HTTP/1.1 upgrade with the Upgrade and Connection
    # headers passed through, and a read timeout above the 25 second application heartbeat (the ALB idle timeout
    # in AWS is 120 seconds too).
    location = /api/v1/ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # REST API (and later WebSockets) to the backend.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /openapi.json {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /assets/public-page-media.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Assistant embed page (docs/AI_CONTRACT.md section 13.3): the only route that may be framed by other sites.
    # No X-Frame-Options here; Content-Security-Policy frame-ancestors lists the allowed embedding origins instead.
    # rewrite ... break serves the client shell from this location, so the X-Frame-Options of the .html location
    # below never applies. The embed page also checks the embedding origin against the assistant's allowed list.
    location ^~ /embed/assistants/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors ${TK_EMBED_FRAME_ANCESTORS}" always;
        rewrite ^ /spa.html break;
    }

    # Prerendered pages and the client shell must always be revalidated so new builds take effect.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Public landing pages, the sitemap, and robots.txt (docs/PHASE4_CONTRACT.md section 18). The path words of the
    # pages (/<venuesPath>/<slug>, /<eventsPath>/<slug>, /<profilesPath>/<slug>) come from the property's
    # publicPages section, which nginx does not read, so every two-segment path that is not a file goes to the backend
    # under its fixed prefix /api/v1/public/pages/resolve/. The backend renders the page when the first segment is one
    # of the property's path words and otherwise answers with X-Accel-Redirect: /spa.html, so the website's own routes
    # (for example /lessons/<slug> or /threads/<id>) still get the client shell. /app, /admin, /api, /assets, /embed,
    # and /platform never take this path. When the backend is down, the shell is served instead.
    location ~ "^/(?!app/|admin/|api/|assets/|embed/|platform/)[a-z0-9][a-z0-9-]*/[^/]+/?$" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/index.html @publicpage;
    }

    location @publicpage {
        rewrite "^/([^/]+)/([^/]+?)/?$" /api/v1/public/pages/resolve/$1/$2 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @shell;
    }

    location @shell {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files /spa.html =404;
    }

    # The sitemap index and the child sitemaps of venues, events, and profiles come from the backend; the website
    # build writes the marketing pages' own sitemap (/sitemap-pages.xml), which the index lists and which stands in
    # for the index while the backend is down.
    location = /sitemap.xml {
        rewrite ^ /api/v1/public/pages/sitemap.xml break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sitemappages;
    }

    location @sitemappages {
        try_files /sitemap-pages.xml =404;
    }

    location ~ "^/sitemap-(venues|events|profiles)-([0-9]{1,4})\.xml$" {
        rewrite "^/sitemap-(.+)$" /api/v1/public/pages/sitemaps/$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # App association files from the backend (built from property.json mobile settings) so iOS and Android offer to
    # save and autofill the app's passwords for this domain. Apple fetches the file without an extension and needs JSON.
    location = /.well-known/apple-app-site-association {
        rewrite ^ /api/v1/public/pages/well-known/apple-app-site-association break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /.well-known/assetlinks.json {
        rewrite ^ /api/v1/public/pages/well-known/assetlinks.json break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # robots.txt from the backend (it names the sitemap and allows the public media paths the pages use); the
    # website build's robots.txt stands in while the backend is down.
    location = /robots.txt {
        rewrite ^ /api/v1/public/pages/robots.txt break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_intercept_errors on;
        error_page 502 503 504 = @robotsfile;
    }

    location @robotsfile {
        try_files /robots.txt =404;
    }

    # Prerendered marketing pages are served from <route>/index.html; everything else (member app,
    # admin console, auth pages, unknown paths) falls back to the client-only shell.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/index.html /spa.html;
    }
}
