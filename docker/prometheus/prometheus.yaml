global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Server metrics (Watson HTTP layer plus TrellisKit application meters) arrive at the collector via OTLP
  # and are exposed for scraping on :8889.
  - job_name: trelliskit
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
